name: Validar laboratório PIX

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Consulta_MEI_GitHub_Pronto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar sintaxe
        run: |
          node --check api/cnpj.js
          node --check api/pix.js
          node --check api/pix-lab.js
      - name: Testes sem acessar o PSP
        run: npm test
