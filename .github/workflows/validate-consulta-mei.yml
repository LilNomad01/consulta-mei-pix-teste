name: Validar consulta MEI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Consulta_MEI_GitHub_Pronto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar sintaxe do projeto
        run: npm test
